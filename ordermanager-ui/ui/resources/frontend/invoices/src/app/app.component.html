@if (!isAuthenticated()) {
  <div class="app-header p-shadow-4">
    <a
      (click)="router.navigateByUrl('/')"
      [pTooltip]="'tooltips.navigate_home' | transloco"
      tooltipPosition="right"
      class="home-link">
      <img src="assets/home-small.png" alt="Home">
    </a>

    <h3 class="app-title">{{ 'title' | transloco }}</h3>
  </div>

  <app-user-login></app-user-login>
} @else {
  <div class="app-shell">
    <div class="app-header authenticated-header">
      <p-menubar [model]="menuItems" styleClass="app-main-menu">
        <ng-template pTemplate="start">
          <a
            (click)="router.navigateByUrl('/')"
            [pTooltip]="'tooltips.navigate_home' | transloco"
            tooltipPosition="right"
            class="home-link">
            <img src="assets/home-small.png" alt="Home">
          </a>
          <span class="app-title">{{ 'title' | transloco }}</span>
        </ng-template>

        <ng-template pTemplate="end">
        </ng-template>
      </p-menubar>
    </div>

  </div>
}
<router-outlet></router-outlet>
